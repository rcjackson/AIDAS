[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidas-atmos"
description = "AI-guided adaptive sampling for the Argonne Testbed for Multiscale Observational Studies (ATMOS): detect mesoscale boundaries in NEXRAD radar data and cue ground-based instruments from the result."
readme = "README.rst"
authors = [
  {name = "Robert Clyde Jackson", email = "rjackson@anl.gov"}
]
maintainers = [
  {name = "Robert Clyde Jackson", email = "rjackson@anl.gov"}
]
classifiers = [

]
license = {text = "BSD license"}
dependencies = [
    "torchvision",
    "torch",
    "huggingface_hub",
    "arm_pyart",
    "cmweather",
    "safetensors",
    "cartopy",
    "boto3",
    "paramiko"
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff",  # linting
    "tox", # testing
]

[project.urls]

bugs = "https://github.com/rcjackson/AIDAS/issues"
changelog = "https://rcjackson.github.io/AIDAS/history.html"
documentation = "https://rcjackson.github.io/AIDAS/"
homepage = "https://github.com/rcjackson/AIDAS"
repository = "https://github.com/rcjackson/AIDAS"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]


[tool.setuptools.dynamic]
version = {attr = "aidas.__version__"}

# Mypy
# ----

[tool.mypy]
files = "."
# The compat/ tree is a standalone shim project for the deprecated adam-atmos
# distribution; it is built and published separately, not type-checked here.
exclude = ["^compat/"]

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.tox]
legacy_tox_ini = """
[tox]
min_version = 4.0
env_list = py39, py310, py311, py312, py313, ruff
isolated_build = true

[gh]
python =
    3.13 = py313
    3.12 = py312
    3.11 = py311
    3.10 = py310
    3.9 = py39
    3.8 = py38

[testenv]
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:ruff]
deps =
    ruff
commands =
    ruff check .
"""